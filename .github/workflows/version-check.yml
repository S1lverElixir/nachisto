name: version-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install test dependencies
        run: python3 -m pip install --user -r tests/requirements.txt
      - name: Run harness self-test
        run: python3 tests/harness.py self-test
      - name: Run static checks
        run: python3 tests/harness.py static
      - name: Run package smoke test
        run: python3 tests/harness.py package
      - name: Measure context without external tokenizer
        run: python3 tests/harness.py measure --tokenizer none

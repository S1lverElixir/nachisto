name: Новый штамп
description: Нашёл ИИ-штамп, который скилл не ловит (или ловит лишний раз)
labels: ["pattern"]
body:
  - type: textarea
    id: example
    attributes:
      label: Пример текста со штампом
      description: "Короткий фрагмент, 1–3 предложения, лучше из реального ИИ-текста. Не присылайте персональные данные, секреты и закрытые документы. Обезличьте пример: удалите имена, адреса, телефоны, токены, ключи, ссылки на внутренние ресурсы и другую конфиденциальную информацию."
    validations:
      required: true
  - type: dropdown
    id: genre
    attributes:
      label: Жанр текста
      options:
        - блог/личная проза
        - документация/help
        - юридический/нормативный
        - академический
        - художественный
        - маркетинг
        - переписка/чат
        - mixed RU/EN
        - таблицы
        - другой
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: Чего не хватает в правке
      description: "Как, по-твоему, должен выглядеть перепис этого фрагмента. Не присылайте персональные данные, секреты, закрытые документы и ссылки на внутренние ресурсы; обезличьте и предлагаемую правку."
  - type: input
    id: source
    attributes:
      label: Источник
      description: "Какая модель генерировала текст, ссылка — если есть. Не присылайте персональные данные, секреты, закрытые документы и ссылки на внутренние ресурсы."

name: Новый штамп
description: Нашёл ИИ-штамп, который скилл не ловит (или ловит лишний раз)
labels: ["pattern"]
body:
  - type: textarea
    id: example
    attributes:
      label: Пример текста со штампом
      description: Короткий фрагмент, 1–3 предложения, лучше из реального ИИ-текста. Паттерны растут из таких репортов.
    validations:
      required: true
  - type: dropdown
    id: genre
    attributes:
      label: Жанр текста
      options:
        - блог / личная проза
        - справка / техника / документация
        - юридический / нормативный
        - академический
        - маркетинг / промо
        - переписка / неформальный
        - другой
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: Чего не хватает в правке
      description: Как, по-твоему, должен выглядеть перепис этого фрагмента
  - type: input
    id: source
    attributes:
      label: Источник
      description: Какая модель генерировала текст, ссылка — если есть
